<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="./kelp.css" />
	</head>

	<body class="flex direction-column justify-center">
		<form class="container stack" name="compose-email">
			<label>
				To:
				<input
					name="to"
					type="text"
				/>
			</label>

			<label>
				CC:
				<input
					name="cc"
					type="text"
				/>
			</label>

			<label>
				BCC:
				<input
					name="bcc"
					type="text"
				/>
			</label>

			<label>
				Subject:
				<input
					name="subject"
					type="text"
				/>
			</label>

			<label>
				Body:
				<textarea
					name="body"
				></textarea>
			</label>

			<div class="split">
				<button class="danger" type="reset">Delete draft</button>

				<button class="primary" type="submit">Save draft</button>
			</div>
		</form>

		<script src="./email.js" type="module"></script>
	</body>
</html>
