<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="./kelp.css" />
	</head>

	<body class="flex direction-column justify-center">
		<form class="container stack" name="register">
			<label>
				Name:
				<input
					name="displayName"
					placeholder="Alex Smith"
					type="text"
				/>
			</label>

			<label>
				Email:
				<input
					name="email"
					placeholder="alex@example.com"
					type="email"
				/>
			</label>

			<button class="primary" type="submit">Submit</button>
		</form>

		<script src="./register.js" type="module"></script>
	</body>
</html>
